name: Build P.E.N.Y Windows Installer

# Builds the Windows installer on a free GitHub Windows machine, starts the
# app once as a test, and only publishes a Release if the app really runs.
# Works whether the files were uploaded in folders or all at the top level.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peny-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put files into backend and frontend folders
        run: |
          # GitHub's web uploader flattens folders, so sort files back where they belong.
          mkdir -p backend frontend
          for f in *.js; do
            case "$f" in
              main.js) ;;                          # Electron start file stays at the top
              sw.js) mv -f "$f" frontend/ ;;       # service worker belongs with the web page
              *) mv -f "$f" backend/ ;;            # everything else is the engine
            esac
          done
          for f in index.html manifest.json icon-192.png icon-512.png; do
            if [ -f "$f" ]; then mv -f "$f" frontend/; fi
          done
          rm -f backend/gocardless.js package-lock.json   # old bank sync (replaced in 1.9.0)
          echo "backend:";  ls backend
          echo "frontend:"; ls frontend

      - name: Check all app files are present
        run: |
          missing=0
          for f in main.js package.json icon.ico \
                   backend/server.js backend/db.js backend/auth.js backend/forecast.js backend/pensions.js \
                   backend/investments.js backend/growth.js backend/reports.js backend/importers.js \
                   backend/exporters.js backend/enablebanking.js backend/secretbox.js \
                   frontend/index.html frontend/sw.js frontend/manifest.json; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "Upload the missing files and run again."; exit 1; fi
          echo "All app files present"

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Test - start the app and check it answers
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          Write-Host "Starting $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4278/api/health" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Engine OK: $($r.Content)"; $ok = $true; break }
            } catch {}
          }
          if ($ok) {
            try {
              $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4278/" -TimeoutSec 5
              if ($page.Content -like "*P.E.N*") { Write-Host "Front page OK" } else { Write-Host "Front page looks wrong"; $ok = $false }
            } catch { Write-Host "Front page did not load"; $ok = $false }
          }
          $log = Join-Path $env:APPDATA "P.E.N.Y\startup.log"
          if (Test-Path $log) { Write-Host "---- startup.log ----"; Get-Content $log }
          Get-Process | Where-Object { $_.Path -like "*win-unpacked*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "P.E.N.Y did not start - see the log above. No release was published." }

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: peny-windows-installer
          path: dist/*.exe

      - name: Publish release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.exe --title "P.E.N.Y $VERSION (build ${{ github.run_number }}) - tested" --notes "Tested: the app started and answered on this build machine before publishing. Unsigned installer - if SmartScreen warns, click More info, then Run anyway."
